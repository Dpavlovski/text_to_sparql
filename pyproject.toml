[tool.poetry]
name = "text-to-sparql"
version = "0.1.0"
description = "A system that translates natural language questions into SPARQL queries."
authors = ["author <author>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.13,<3.15"
# --- Core Frameworks ---
langchain = "0.3.28"
langchain-community = "==0.3.*"
langchain-core = "^0.3.84"
langgraph = "^0.6.11"

# --- LLM Providers ---
langchain-openai = "0.3.35"
langchain-anthropic = "0.3.0"

# --- Data & Settings ---
pydantic = "^2.13.3"
pydantic-settings = "^2.14.0"
ujson = "^5.12.0"

# --- Network & Web ---
requests = "^2.33.1"
aiohttp = "^3.13.4"

# --- Databases ---
qdrant-client = "^1.17.1"

# --- Machine Learning & NLP ---
transformers = "4.57.6"
torch = "^2.11.0"
datasets = "^3.6.0"
sentencepiece = "^0.2.1"
sacremoses = "^0.1.1"
numpy = "^2.4.4"

# --- Wikidata & SPARQL ---
pywikibot = "^11.2.0"
rdflib = "^7.6.0"

# --- UI & Visualizations ---
streamlit = "^1.57.0"
plotly = "^6.7.0"

# --- Utilities ---
loguru = "^0.7.3"
tqdm = "^4.67.3"
pandas = "^2.3.3"
pandas-stubs = "~=2.3.3"

# --- Dev Tools ---
poetry-core = "^2.4.0"
ipython = "^9.13.0"
notebook = "^7.5.6"
pytest = "^9.0.3"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
